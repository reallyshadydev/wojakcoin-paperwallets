<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0b90b"/>
      <stop offset="100%" style="stop-color:#c99a06"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#a07808"/>
    </linearGradient>
  </defs>
  <!-- Outer rim -->
  <circle cx="100" cy="100" r="98" fill="url(#rimGrad)" stroke="#8b7300" stroke-width="2"/>
  <!-- Inner coin face -->
  <circle cx="100" cy="100" r="88" fill="url(#coinGrad)"/>
  <!-- Inner ring decoration -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.6"/>
  <!-- W letter -->
  <text x="100" y="125" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="#1a1a2e" text-anchor="middle" opacity="0.85">W</text>
</svg>
