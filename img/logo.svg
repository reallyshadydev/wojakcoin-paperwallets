<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d0d0"/>
      <stop offset="50%" style="stop-color:#b0b0b0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <clipPath id="coinClip">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- Outer rim -->
  <circle cx="100" cy="100" r="98" fill="url(#rimGrad)" stroke="#606060" stroke-width="2"/>
  <!-- Inner coin face -->
  <circle cx="100" cy="100" r="90" fill="url(#coinGrad)"/>
  <!-- Inner ring decorations -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#a0a0a0" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#999" stroke-width="1"/>

  <!-- Portrait group clipped to coin -->
  <g clip-path="url(#coinClip)">
    <!-- Background fill for portrait area -->
    <rect x="18" y="18" width="164" height="164" fill="#b8b8b8" opacity="0.3"/>

    <!-- Hair - wild, messy philosopher style -->
    <path d="M58 72 Q52 45 65 35 Q72 28 80 32 Q85 25 95 22 Q105 19 112 24 Q120 20 130 28 Q142 35 145 50 Q150 42 148 60 Q152 55 150 70 Q155 65 152 78 Q148 68 146 75 Q144 60 140 55 Q138 48 130 42 Q122 36 112 38 Q105 34 95 36 Q85 34 78 40 Q70 45 66 55 Q62 62 60 70 Z" fill="#4a4a4a" stroke="#333" stroke-width="1"/>

    <!-- More hair volume on sides -->
    <path d="M55 70 Q50 55 58 42 Q52 50 50 65 Q48 75 52 82 Q55 78 55 70Z" fill="#4a4a4a" stroke="#333" stroke-width="0.5"/>
    <path d="M148 65 Q152 50 145 42 Q150 55 152 70 Q153 80 150 85 Q147 78 148 65Z" fill="#4a4a4a" stroke="#333" stroke-width="0.5"/>

    <!-- Hair wisps -->
    <path d="M60 38 Q55 30 58 22" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 28 Q72 18 76 12" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M95 20 Q93 12 97 8" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M115 22 Q118 14 115 8" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M135 30 Q140 20 138 14" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
    <path d="M145 42 Q150 32 147 25" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Face shape -->
    <path d="M68 72 Q66 85 68 95 Q70 108 78 118 Q85 126 95 130 Q100 132 105 130 Q115 126 122 118 Q130 108 132 95 Q134 85 132 72 Q130 62 125 58 Q118 52 110 50 Q100 48 90 50 Q82 52 75 58 Q70 62 68 72Z" fill="#d4c8b8" stroke="#8a7e6e" stroke-width="1"/>

    <!-- Forehead lines -->
    <path d="M78 65 Q100 62 122 65" fill="none" stroke="#a89880" stroke-width="0.7" opacity="0.6"/>
    <path d="M80 70 Q100 67 120 70" fill="none" stroke="#a89880" stroke-width="0.7" opacity="0.5"/>

    <!-- Left eyebrow - slightly furrowed -->
    <path d="M76 78 Q82 74 92 76" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <!-- Right eyebrow -->
    <path d="M108 76 Q118 74 124 78" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>

    <!-- Left eye -->
    <ellipse cx="84" cy="84" rx="7" ry="5" fill="#fff" stroke="#555" stroke-width="1"/>
    <circle cx="85" cy="84" r="3" fill="#444"/>
    <circle cx="86" cy="83" r="1" fill="#fff"/>

    <!-- Right eye -->
    <ellipse cx="116" cy="84" rx="7" ry="5" fill="#fff" stroke="#555" stroke-width="1"/>
    <circle cx="115" cy="84" r="3" fill="#444"/>
    <circle cx="116" cy="83" r="1" fill="#fff"/>

    <!-- Nose -->
    <path d="M98 82 Q96 92 94 100 Q92 104 96 106 Q100 108 104 106 Q108 104 106 100" fill="none" stroke="#8a7e6e" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Mouth - slight smirk -->
    <path d="M88 114 Q95 118 100 117 Q105 118 112 114" fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nasolabial folds -->
    <path d="M82 98 Q84 106 88 113" fill="none" stroke="#a89880" stroke-width="0.7" opacity="0.5"/>
    <path d="M118 98 Q116 106 112 113" fill="none" stroke="#a89880" stroke-width="0.7" opacity="0.5"/>

    <!-- Chin -->
    <path d="M95 128 Q100 132 105 128" fill="none" stroke="#a89880" stroke-width="0.8" opacity="0.5"/>

    <!-- Neck -->
    <path d="M88 130 Q86 138 84 148 L82 165" fill="none" stroke="#8a7e6e" stroke-width="1"/>
    <path d="M112 130 Q114 138 116 148 L118 165" fill="none" stroke="#8a7e6e" stroke-width="1"/>

    <!-- Collar / Cravat -->
    <path d="M70 155 Q78 148 88 142 Q92 140 96 142 L100 148 L104 142 Q108 140 112 142 Q122 148 130 155 L135 165 Q130 170 120 175 L115 180 Q100 185 85 180 L80 175 Q70 170 65 165 Z" fill="#666" stroke="#444" stroke-width="1"/>

    <!-- Cravat/tie detail -->
    <path d="M96 142 L100 155 L104 142" fill="#888" stroke="#555" stroke-width="0.8"/>
    <path d="M98 148 L100 160 L102 148" fill="none" stroke="#555" stroke-width="0.5"/>

    <!-- Coat lapels -->
    <path d="M65 165 Q60 175 55 200 L30 200 L40 175 Q50 158 65 155Z" fill="#555" stroke="#333" stroke-width="1"/>
    <path d="M135 165 Q140 175 145 200 L170 200 L160 175 Q150 158 135 155Z" fill="#555" stroke="#333" stroke-width="1"/>

    <!-- Coat lapel fold lines -->
    <path d="M62 160 Q55 175 48 200" fill="none" stroke="#444" stroke-width="0.7"/>
    <path d="M138 160 Q145 175 152 200" fill="none" stroke="#444" stroke-width="0.7"/>

    <!-- Sideburns -->
    <path d="M68 72 Q64 80 62 92 Q60 100 63 105 Q66 100 67 92 Q68 84 68 72Z" fill="#4a4a4a" stroke="#333" stroke-width="0.5"/>
    <path d="M132 72 Q136 80 138 92 Q140 100 137 105 Q134 100 133 92 Q132 84 132 72Z" fill="#4a4a4a" stroke="#333" stroke-width="0.5"/>
  </g>
</svg>
